<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f12"><title>ASMR Library</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1180px;margin:auto;padding:0 18px 118px}.header{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.94);backdrop-filter:blur(14px);border-bottom:1px solid #252a30}.headin{height:64px;display:flex;align-items:center;gap:22px}.logo{font-weight:900;letter-spacing:-.4px;font-size:22px}.nav{display:flex;gap:18px;font-size:13px;color:#9da3ad}.nav span:first-child{color:#fff}.grow{flex:1}.iconbtn,.btn{border:1px solid #2c3138;background:#181b20;color:#fff;border-radius:10px;padding:9px 12px;font-size:13px}.mainbtn{background:#fff;color:#111;border-color:#fff}.hero{padding:34px 0 18px}.hero h1{font-size:28px;margin:0 0 8px}.hero p{margin:0;color:#9da3ad;font-size:13px}.tools{display:flex;gap:10px;align-items:center;margin:18px 0}.search{flex:1;min-width:180px;background:#171a1f;border:1px solid #2b3037;color:#fff;padding:12px 14px;border-radius:11px;outline:none}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid #2b3037;background:#171a1f;color:#aeb4bd;border-radius:999px;padding:7px 11px;font-size:12px}.chip.on{background:#fff;color:#111;border-color:#fff}.section{display:flex;justify-content:space-between;align-items:end;margin:24px 0 12px}.section h2{font-size:18px;margin:0}.muted{color:#8e949d;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.work{background:#15181d;border:1px solid #252a31;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}.work:hover{transform:translateY(-2px);border-color:#3a424d}.cover{aspect-ratio:1/1;background:radial-gradient(circle at 30% 20%,#4a5160,#1a1e24 58%,#0f1114);display:flex;align-items:center;justify-content:center;font-size:42px}.body{padding:12px}.title{font-size:14px;font-weight:750;line-height:1.45;min-height:40px}.artist{font-size:11px;color:#9ba1ab;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge{font-size:10px;padding:4px 7px;border-radius:6px;background:#22272e;color:#aeb4bd}.empty{grid-column:1/-1;color:#8e949d;text-align:center;padding:30px}.page{display:block}.detail{display:none}.detailgrid{display:grid;grid-template-columns:300px 1fr;gap:24px;margin-top:24px}.detailcover{border-radius:14px;aspect-ratio:1/1;background:radial-gradient(circle at 30% 20%,#565e6b,#1a1e24 58%,#0f1114);display:flex;align-items:center;justify-content:center;font-size:64px}.detail h1{font-size:26px;margin:5px 0}.desc{color:#a4aab3;line-height:1.7;font-size:13px;white-space:pre-wrap}.tracks{margin-top:20px;border-top:1px solid #292e35}.track{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid #292e35;cursor:pointer}.track:hover{background:#171b20}.num{width:32px;color:#767d87;text-align:center}.tn{font-size:13px;font-weight:650}.ts{font-size:11px;color:#7f8690;margin-top:3px}.spacer{flex:1}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;padding:18px;align-items:center;justify-content:center}.modalbox{width:min(560px,100%);background:#15181d;border:1px solid #2a3037;border-radius:16px;padding:18px}.modal h3{margin:0 0 8px}.input{width:100%;margin-top:9px;background:#1b1f25;border:1px solid #2b3138;color:#fff;padding:11px 12px;border-radius:10px}.player{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(18,21,25,.97);backdrop-filter:blur(15px);border-top:1px solid #2b3138}.playerin{max-width:1180px;margin:auto;padding:10px 18px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(160px,1fr) auto minmax(180px,1fr);gap:16px;align-items:center}.nowtitle{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowmeta{font-size:10px;color:#7f8690;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcontrols{display:flex;gap:7px;align-items:center}.pbtn{width:38px;height:38px;border-radius:50%;border:1px solid #313740;background:#1e2228;color:#fff}.pbtn.main{background:#fff;color:#111}.progress{width:100%}.progress input{width:100%}.ptime{display:flex;justify-content:space-between;color:#7f8690;font-size:9px;margin-top:2px}.extras{display:flex;justify-content:flex-end;gap:10px;align-items:center}.sel{background:#1e2228;color:#fff;border:1px solid #313740;border-radius:8px;padding:7px 8px;font-size:11px}.notice{font-size:11px;color:#747b85;margin-top:8px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.detailgrid{grid-template-columns:220px 1fr}}@media(max-width:650px){.app{padding-left:11px;padding-right:11px}.nav{display:none}.hero{padding-top:24px}.tools{display:block}.search{width:100%}.chips{margin-top:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detailgrid{grid-template-columns:1fr}.detailcover{max-width:320px;margin:auto}.playerin{grid-template-columns:1fr auto}.extras{display:none}.progress{grid-column:1/-1;grid-row:2}.pcontrols{justify-content:flex-end}.playerin{gap:10px}.title{min-height:0}}
</style></head><body><div class="header"><div class="headin app"><div class="logo">ASMR Library</div><div class="nav"><span>ホーム</span><span>作品</span><span>お気に入り</span></div><div class="grow"></div><button class="btn" id="openAdd">＋ 作品を登録</button></div></div><div class="app"><div id="page" class="page"><section class="hero"><h1>ASMRをゆっくり楽しむ</h1><p>作品を選んで、トラックを再生。iPhoneのロック画面からも操作できます。</p></section><div class="tools"><input class="search" id="search" placeholder="作品名・CV・キーワードで検索"><div class="chips"><button class="chip on" data-filter="all">すべて</button><button class="chip" data-filter="fav">お気に入り</button></div></div><div class="section"><h2>作品一覧</h2><div class="muted" id="count"></div></div><div class="grid" id="works"></div></div><div id="detail" class="detail"><button class="btn" id="backHome">← 作品一覧</button><div class="detailgrid"><div><div class="detailcover">🎧</div></div><div><div class="muted" id="detailArtist"></div><h1 id="detailTitle"></h1><div class="desc" id="detailDesc"></div><div class="section" style="margin-top:24px"><h2>トラック</h2><button class="btn" id="fav">☆ お気に入り</button></div><div class="tracks" id="tracks"></div></div></div></div></div><div id="modal" class="modal"><div class="modalbox"><h3>作品を登録</h3><div class="muted">作品情報と音声URLを登録できます。</div><input class="input" id="newTitle" placeholder="作品タイトル"><input class="input" id="newArtist" placeholder="CV・出演者"><textarea class="input" id="newDesc" placeholder="作品説明" rows="4"></textarea><input class="input" id="newTrack" placeholder="トラック名（例：01 本編）"><input class="input" id="newAudio" placeholder="音声URL（mp3 / m4a）"><div style="display:flex;gap:8px;margin-top:12px"><button class="btn mainbtn" id="saveWork">登録</button><button class="btn" id="closeAdd">キャンセル</button></div><div class="notice">この版では公開URLの音声を登録できます。音源を公開・利用する権利はご自身で確認してください。</div></div></div><div class="player"><div class="playerin"><div><div class="nowtitle" id="nowTitle">再生プレーヤー</div><div class="nowmeta" id="nowMeta">未選択</div></div><div class="pcontrols"><button class="pbtn" id="prev">⏮</button><button class="pbtn" id="back">↶</button><button class="pbtn main" id="play">▶</button><button class="pbtn" id="fwd">↷</button><button class="pbtn" id="next">⏭</button></div><div class="extras"><select class="sel" id="rate"><option>0.75</option><option>0.9</option><option selected>1</option><option>1.1</option><option>1.25</option><option>1.5</option></select><select class="sel" id="sleep"><option value="0">スリープなし</option><option value="15">15分</option><option value="30">30分</option><option value="60">60分</option><option value="90">90分</option><option value="120">120分</option></select></div><div class="progress"><input id="seek" type="range" min="0" max="100" value="0"><div class="ptime"><span id="cur">0:00</span><span id="dur">0:00</span></div></div></div></div><audio id="audio" preload="metadata"></audio><script>
const $=id=>document.getElementById(id);const audio=$("audio");let works=JSON.parse(localStorage.getItem("asmrWorksV2")||"null")||[{id:"demo",title:"海姉妹 ～長女・希海＆三女・夏帆～",artist:"CV. 佐藤聡美＆津田美波",desc:"泳いだ後に姉妹とゆったり過ごすASMR。\nトラックを登録して自分用ライブラリとして使えます。",tracks:[],fav:false}];let currentWork=null,currentIndex=-1,queue=[],sleepTimer=null;
function save(){localStorage.setItem("asmrWorksV2",JSON.stringify(works))}function esc(s){return String(s||"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function fmt(s){if(!isFinite(s))return"0:00";s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function render(){const q=$("search").value.trim().toLowerCase();const fav=document.querySelector('.chip.on')?.dataset.filter==='fav';const list=works.filter(w=>(!q||(w.title+w.artist+w.desc).toLowerCase().includes(q))&&(!fav||w.fav));$("works").innerHTML="";$("count").textContent=list.length+"作品";if(!list.length){$("works").innerHTML='<div class="empty">該当する作品がありません。</div>';return}list.forEach(w=>{const d=document.createElement("div");d.className="work";d.innerHTML=`<div class="cover">🎧</div><div class="body"><div class="title">${esc(w.title)}</div><div class="artist">${esc(w.artist||"")}</div><div class="badges"><span class="badge">${w.tracks.length}トラック</span>${w.fav?'<span class="badge">★ お気に入り</span>':''}</div></div>`;d.onclick=()=>openDetail(w.id);$("works").appendChild(d)})}
function openDetail(id){currentWork=works.find(w=>w.id===id);if(!currentWork)return;$("page").style.display="none";$("detail").style.display="block";$("detailTitle").textContent=currentWork.title;$("detailArtist").textContent=currentWork.artist||"";$("detailDesc").textContent=currentWork.desc||"";$("fav").textContent=currentWork.fav?"★ お気に入り":"☆ お気に入り";$("tracks").innerHTML="";if(!currentWork.tracks.length){$("tracks").innerHTML='<div class="empty">まだトラックがありません。<br>「＋ 作品を登録」から追加できます。</div>'}else currentWork.tracks.forEach((t,i)=>{const d=document.createElement("div");d.className="track";d.innerHTML=`<div class="num">${String(i+1).padStart(2,"0")}</div><div><div class="tn">${esc(t.name)}</div><div class="ts">${t.url?'音声URLあり':'音声未登録'}</div></div><div class="spacer"></div><div class="muted">▶</div>`;d.onclick=()=>playTrack(currentWork,i);$("tracks").appendChild(d)})}function closeDetail(){$("page").style.display="block";$ ("detail").style.display="none";currentWork=null}$("backHome").onclick=closeDetail;$("fav").onclick=()=>{if(currentWork){currentWork.fav=!currentWork.fav;save();openDetail(currentWork.id);render()}};
$("search").oninput=render;document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');render()});$("openAdd").onclick=()=>$("modal").style.display="flex";$("closeAdd").onclick=()=>$("modal").style.display="none";
$("saveWork").onclick=()=>{const title=$("newTitle").value.trim(),artist=$("newArtist").value.trim(),desc=$("newDesc").value.trim(),url=$("newAudio").value.trim(),track=$("newTrack").value.trim()||"01 本編";if(!title||!url)return alert("作品タイトルと音声URLを入力してください。");works.unshift({id:crypto.randomUUID(),title,artist,desc,tracks:[{id:crypto.randomUUID(),name:track,url}],fav:false});save();$("modal").style.display="none";["newTitle","newArtist","newDesc","newTrack","newAudio"].forEach(id=>$(id).value="");render()};
async function playTrack(w,i){currentWork=w;queue=w.tracks.filter(t=>t.url);currentIndex=queue.indexOf(w.tracks[i]);if(currentIndex<0)return;loadTrack()};function loadTrack(){const t=queue[currentIndex];if(!t)return;audio.src=t.url;audio.playbackRate=+$("rate").value;$("nowTitle").textContent=t.name;$("nowMeta").textContent=(currentWork?.title||"")+((currentWork?.artist)?" / "+currentWork.artist:"");if("mediaSession"in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:currentWork?.artist||"ASMR",album:currentWork?.title||"ASMR"});audio.play().catch(()=>{})}
$("play").onclick=()=>{if(!audio.src)return;audio.paused?audio.play():audio.pause()};$("back").onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);$("fwd").onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15);$("prev").onclick=()=>{if(currentIndex>0){currentIndex--;loadTrack()}};$("next").onclick=()=>{if(currentIndex<queue.length-1){currentIndex++;loadTrack()}};audio.onplay=()=>$("play").textContent="⏸";audio.onpause=()=>$("play").textContent="▶";audio.ontimeupdate=()=>{$("seek").value=audio.duration?audio.currentTime/audio.duration*100:0;$("cur").textContent=fmt(audio.currentTime);$("dur").textContent=fmt(audio.duration)};$("seek").oninput=()=>{if(audio.duration)audio.currentTime=$("seek").value/100*audio.duration};$("rate").onchange=()=>audio.playbackRate=+$("rate").value;$("sleep").onchange=()=>{clearTimeout(sleepTimer);const m=+$('sleep').value;if(m)sleepTimer=setTimeout(()=>{audio.pause();$('sleep').value='0'},m*60000)};audio.onended=()=>{if(currentIndex<queue.length-1){currentIndex++;loadTrack()}};
if("mediaSession"in navigator){const b=(n,f)=>{try{navigator.mediaSession.setActionHandler(n,f)}catch(e){}};b('play',()=>audio.play());b('pause',()=>audio.pause());b('seekbackward',()=>audio.currentTime=Math.max(0,audio.currentTime-15));b('seekforward',()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15));b('previoustrack',()=>$("prev").click());b('nexttrack',()=>$("next").click())}render();
</script></body></html>
