<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101012">
<title>ASMR Library</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101012;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:18px 14px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.brand{font-weight:800;font-size:22px}.sub{font-size:12px;color:#999;margin-top:3px}.card{background:#1b1b1e;border:1px solid #2a2a2e;border-radius:18px;padding:16px;margin:12px 0}.search{width:100%;background:#29292d;border:0;color:#fff;padding:13px 14px;border-radius:12px;font-size:15px;outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.work{background:#202024;border:1px solid #2c2c31;border-radius:15px;overflow:hidden;cursor:pointer}.cover{aspect-ratio:1/1;background:linear-gradient(135deg,#34343a,#18181b);display:flex;align-items:center;justify-content:center;font-size:42px}.workbody{padding:13px}.worktitle{font-weight:700;line-height:1.4}.meta{font-size:12px;color:#999;margin-top:5px}.tag{display:inline-block;margin-top:8px;padding:4px 7px;border-radius:7px;background:#303036;color:#bbb;font-size:11px}.hidden{display:none}.title{font-size:20px;font-weight:800;margin:14px 0 4px}.artist{color:#aaa;font-size:13px}.controls{display:flex;justify-content:center;gap:8px;margin:16px 0}.btn{border:0;border-radius:12px;padding:11px 15px;background:#303034;color:#fff;font-size:14px}.mainbtn{background:#fff;color:#111;min-width:58px}.wide{width:100%;margin-top:10px}.range{width:100%;accent-color:#fff}.time{display:flex;justify-content:space-between;color:#999;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.select{background:#303034;border:0;color:#fff;border-radius:10px;padding:9px}.track{display:flex;gap:10px;align-items:center;padding:13px 4px;border-bottom:1px solid #303034;cursor:pointer}.track:last-child{border:0}.track.active{background:#242429;border-radius:10px}.num{width:28px;color:#888;text-align:center}.tn{font-size:14px;font-weight:600}.ts{font-size:11px;color:#888;margin-top:3px}.small{font-size:12px;color:#999;line-height:1.6}.input{flex:1;min-width:180px;background:#29292d;border:0;color:#fff;padding:11px;border-radius:10px}.empty{color:#888;padding:10px 2px}.fav{float:right;color:#aaa}.fav.on{color:#fff}.note{font-size:11px;color:#777;line-height:1.5;margin-top:8px}@media(max-width:500px){.app{padding-left:11px;padding-right:11px}.controls .btn{padding:11px 10px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="brand">ASMR Library</div><div class="sub">作品を選んで、iPhoneでそのまま聴く</div></div><button class="btn" id="addBtn">＋ 作品登録</button></div>
<div class="card"><input class="search" id="search" placeholder="作品名・CVで検索"></div>
<div class="grid" id="works"></div>
<div class="card hidden" id="detail"><button class="btn" id="closeDetail">← 作品一覧</button><div class="cover" id="detailCover" style="margin-top:12px;border-radius:14px">🎧</div><div class="title" id="detailTitle">作品名</div><div class="artist" id="detailArtist">CV</div><div class="small" id="detailDesc" style="margin-top:10px"></div><div class="row between" style="margin-top:15px"><b>トラック</b><button class="btn" id="favBtn">☆ お気に入り</button></div><div id="detailTracks"></div></div>
<div class="card hidden" id="addPanel"><b>作品を登録</b><div class="small" style="margin:8px 0 12px">作品名・CV・説明・音声URLを入力すると作品一覧に追加できます。</div><input class="input wide" id="newTitle" placeholder="作品タイトル"><input class="input wide" id="newArtist" placeholder="CV・出演者"><input class="input wide" id="newDesc" placeholder="説明"><input class="input wide" id="newAudio" placeholder="音声URL（mp3 / m4a など）"><input class="input wide" id="newTrack" placeholder="トラック名（例：01 本編）"><div class="row" style="margin-top:10px"><button class="btn mainbtn" id="saveWork">登録</button><button class="btn" id="cancelAdd">キャンセル</button></div><div class="note">※公開URL方式では、音源の権利・公開範囲を確認してください。</div></div>
<div class="card"><div class="row between"><b id="nowTitle">再生プレーヤー</b><span id="nowMeta" class="small">未選択</span></div><audio id="audio" preload="metadata"></audio><div class="controls"><button class="btn" id="prev">⏮</button><button class="btn" id="back">↶ 15</button><button class="btn mainbtn" id="play">▶</button><button class="btn" id="fwd">15 ↷</button><button class="btn" id="next">⏭</button></div><input class="range" id="seek" type="range" min="0" max="100" value="0"><div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="row between" style="margin-top:12px"><label class="small">速度 <select class="select" id="rate"><option>0.75</option><option>0.9</option><option selected>1</option><option>1.1</option><option>1.25</option><option>1.5</option></select></label><label class="small">スリープ <select class="select" id="sleep"><option value="0">なし</option><option value="15">15分</option><option value="30">30分</option><option value="60">60分</option><option value="90">90分</option><option value="120">120分</option></select></label></div><div class="small" id="status" style="margin-top:10px"></div></div>
<div class="card small"><b>iPhone</b><br>Safariで開いて再生開始 → ホーム画面へ戻る → 画面をロック。Media Session対応端末ではロック画面から操作できます。</div>
</div>
<script>
const $=id=>document.getElementById(id),audio=$("audio");
let works=JSON.parse(localStorage.getItem("asmrWorksV2")||"null");
if(!works){works=[{id:"demo-rj01241146",title:"海姉妹 ～長女・希海＆三女・夏帆～",artist:"CV. 佐藤聡美＆津田美波",desc:"泳いだ後に姉妹とゆったり過ごすASMR。音源URLを登録するとここから再生できます。",tracks:[],fav:false}]}
let currentWork=null,currentIndex=-1,queue=[],sleepTimer=null;
function save(){localStorage.setItem("asmrWorksV2",JSON.stringify(works))}
function fmt(s){if(!isFinite(s))return"0:00";s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function renderWorks(){const q=$("search").value.toLowerCase();$("works").innerHTML="";const list=works.filter(w=>(w.title+w.artist).toLowerCase().includes(q));if(!list.length){$("works").innerHTML='<div class="empty">作品がありません。</div>';return}list.forEach(w=>{const d=document.createElement("div");d.className="work";d.innerHTML=`<div class="cover">🎧</div><div class="workbody"><span class="fav ${w.fav?"on":""}">${w.fav?"★":"☆"}</span><div class="worktitle">${esc(w.title)}</div><div class="meta">${esc(w.artist||"")}</div><span class="tag">${w.tracks.length}トラック</span></div>`;d.onclick=()=>openDetail(w.id);$("works").appendChild(d)})}
function openDetail(id){currentWork=works.find(w=>w.id===id);if(!currentWork)return;$("detail").classList.remove("hidden");$("works").classList.add("hidden");$("search").parentElement.classList.add("hidden");$("detailTitle").textContent=currentWork.title;$("detailArtist").textContent=currentWork.artist||"";$("detailDesc").textContent=currentWork.desc||"";$("favBtn").textContent=currentWork.fav?"★ お気に入り":"☆ お気に入り";$("detailTracks").innerHTML="";if(!currentWork.tracks.length){$("detailTracks").innerHTML='<div class="empty">まだトラックが登録されていません。「＋ 作品登録」から音声URLを追加できます。</div>'}else currentWork.tracks.forEach((t,i)=>{const d=document.createElement("div");d.className="track";d.innerHTML=`<div class="num">${String(i+1).padStart(2,"0")}</div><div><div class="tn">${esc(t.name)}</div><div class="ts">${t.url?"音源あり":"音源未登録"}</div></div>`;d.onclick=()=>{if(t.url)loadQueue(currentWork,i);else $("status").textContent="このトラックには音声URLが登録されていません。"};$("detailTracks").appendChild(d)})}
$("closeDetail").onclick=()=>{$("detail").classList.add("hidden");$("works").classList.remove("hidden");$("search").parentElement.classList.remove("hidden")};
$("favBtn").onclick=()=>{if(!currentWork)return;currentWork.fav=!currentWork.fav;$("favBtn").textContent=currentWork.fav?"★ お気に入り":"☆ お気に入り";save();renderWorks()};
$("search").oninput=renderWorks;$("addBtn").onclick=()=>$("addPanel").classList.remove("hidden");$("cancelAdd").onclick=()=>$("addPanel").classList.add("hidden");
$("saveWork").onclick=()=>{const title=$("newTitle").value.trim(),artist=$("newArtist").value.trim(),desc=$("newDesc").value.trim(),url=$("newAudio").value.trim(),track=$("newTrack").value.trim()||"01 本編";if(!title)return alert("作品タイトルを入力してください。");const w={id:Date.now().toString(),title,artist,desc,tracks:url?[{name:track,url}]:[],fav:false};works.unshift(w);save();renderWorks();openDetail(w.id);$("addPanel").classList.add("hidden");["newTitle","newArtist","newDesc","newAudio","newTrack"].forEach(id=>$(id).value="")};
function loadQueue(w,i){currentWork=w;queue=w.tracks.filter(t=>t.url);currentIndex=queue.indexOf(w.tracks[i]);if(currentIndex<0)return;loadTrack()}
function loadTrack(autoplay=true){const t=queue[currentIndex];if(!t)return;audio.src=t.url;audio.playbackRate=parseFloat($("rate").value);$("nowTitle").textContent=t.name;$("nowMeta").textContent=currentWork?currentWork.title:"";if("mediaSession"in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:currentWork?.artist||"ASMR",album:currentWork?.title||"ASMR"});if(autoplay)audio.play().catch(()=>$("status").textContent="画面上の再生ボタンを押してください。")}
$("play").onclick=()=>{if(!audio.src)return;if(audio.paused)audio.play();else audio.pause()};$("back").onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);$("fwd").onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15);$("prev").onclick=()=>{if(currentIndex>0){currentIndex--;loadTrack()}};$("next").onclick=()=>{if(currentIndex<queue.length-1){currentIndex++;loadTrack()}};audio.onplay=()=>{$("play").textContent="⏸";setSleep()};audio.onpause=()=>$("play").textContent="▶";audio.ontimeupdate=()=>{$("seek").value=audio.duration?audio.currentTime/audio.duration*100:0;$("cur").textContent=fmt(audio.currentTime);$("dur").textContent=fmt(audio.duration)};$("seek").oninput=()=>{if(audio.duration)audio.currentTime=$("seek").value/100*audio.duration};$("rate").onchange=()=>audio.playbackRate=parseFloat($("rate").value);
function setSleep(){clearTimeout(sleepTimer);const min=+$('sleep').value;if(min){sleepTimer=setTimeout(()=>{audio.pause();$('sleep').value='0';$('status').textContent='スリープタイマーで停止しました。'},min*60000);$('status').textContent=min+'分後に停止します。'}else $('status').textContent=''}$('sleep').onchange=setSleep;
audio.onended=()=>{if(currentIndex<queue.length-1){currentIndex++;loadTrack()}else if('mediaSession'in navigator)navigator.mediaSession.playbackState='none'};
if('mediaSession'in navigator){const b=(n,f)=>{try{navigator.mediaSession.setActionHandler(n,f)}catch(e){}};b('play',()=>audio.play());b('pause',()=>audio.pause());b('seekbackward',()=>audio.currentTime=Math.max(0,audio.currentTime-15));b('seekforward',()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15));b('previoustrack',()=>$("prev").click());b('nexttrack',()=>$("next").click())}
renderWorks();
</script>
</body></html>
