<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101012"><title>ASMR Library</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101012;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:18px 14px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.brand{font-weight:800;font-size:22px}.sub,.small{font-size:12px;color:#999;line-height:1.6}.card{background:#1b1b1e;border:1px solid #2a2a2e;border-radius:18px;padding:16px;margin:12px 0}.search,.input{width:100%;background:#29292d;border:0;color:#fff;padding:13px 14px;border-radius:12px;font-size:15px;outline:none;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.work{background:#202024;border:1px solid #2c2c31;border-radius:15px;overflow:hidden;cursor:pointer}.cover{aspect-ratio:1/1;background:linear-gradient(135deg,#34343a,#18181b);display:flex;align-items:center;justify-content:center;font-size:42px}.workbody{padding:13px}.worktitle{font-weight:700;line-height:1.4}.meta{font-size:12px;color:#999;margin-top:5px}.tag{display:inline-block;margin-top:8px;padding:4px 7px;border-radius:7px;background:#303036;color:#bbb;font-size:11px}.hidden{display:none}.title{font-size:20px;font-weight:800;margin:14px 0 4px}.artist{color:#aaa;font-size:13px}.controls{display:flex;justify-content:center;gap:8px;margin:16px 0}.btn{border:0;border-radius:12px;padding:11px 15px;background:#303034;color:#fff;font-size:14px}.mainbtn{background:#fff;color:#111;min-width:58px}.wide{width:100%;margin-top:10px}.range{width:100%;accent-color:#fff}.time{display:flex;justify-content:space-between;color:#999;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.select{background:#303034;border:0;color:#fff;border-radius:10px;padding:9px}.track{display:flex;gap:10px;align-items:center;padding:13px 4px;border-bottom:1px solid #303034;cursor:pointer}.track.active{background:#242429;border-radius:10px}.num{width:28px;color:#888;text-align:center}.tn{font-size:14px;font-weight:600}.ts{font-size:11px;color:#888;margin-top:3px}.empty{color:#888;padding:10px 2px}.fav{float:right;color:#aaa}.fav.on{color:#fff}.note{font-size:11px;color:#777;line-height:1.5;margin-top:8px}label{font-size:12px;color:#aaa}@media(max-width:500px){.app{padding-left:11px;padding-right:11px}.controls .btn{padding:11px 10px}}</style></head><body><div class="app"><div class="top"><div><div class="brand">ASMR Library</div><div class="sub">作品と音声をこのiPhoneに保存して聴く</div></div><button class="btn" id="addBtn">＋ 作品登録</button></div><div class="card"><input class="search" id="search" placeholder="作品名・CVで検索"></div><div class="grid" id="works"></div><div class="card hidden" id="detail"><button class="btn" id="closeDetail">← 作品一覧</button><div class="cover" style="margin-top:12px;border-radius:14px">🎧</div><div class="title" id="detailTitle">作品名</div><div class="artist" id="detailArtist">CV</div><div class="small" id="detailDesc" style="margin-top:10px"></div><div class="row between" style="margin-top:15px"><b>トラック</b><button class="btn" id="favBtn">☆ お気に入り</button></div><div id="detailTracks"></div></div><div class="card hidden" id="addPanel"><b>作品を登録</b><div class="small">音声ファイルを選択して登録すると、このiPhoneのSafari内に保存されます。次回開いたときも残ります。</div><input class="input" id="newTitle" placeholder="作品タイトル"><input class="input" id="newArtist" placeholder="CV・出演者"><input class="input" id="newDesc" placeholder="説明"><input class="input" id="newTrack" placeholder="トラック名（例：01 本編）"><label style="display:block;margin-top:12px">音声ファイル</label><input class="input" id="newFile" type="file" accept="audio/*"><label style="display:block;margin-top:12px">または音声URL</label><input class="input" id="newAudio" placeholder="https://.../audio.mp3"><div class="row" style="margin-top:10px"><button class="btn mainbtn" id="saveWork">登録して保存</button><button class="btn" id="cancelAdd">キャンセル</button></div><div class="note">端末内保存はIndexedDBを使用します。SafariのWebサイトデータを削除すると保存した音声も消える場合があります。</div></div><div class="card"><div class="row between"><b id="nowTitle">再生プレーヤー</b><span id="nowMeta" class="small">未選択</span></div><audio id="audio" preload="metadata"></audio><div class="controls"><button class="btn" id="prev">⏮</button><button class="btn" id="back">↶ 15</button><button class="btn mainbtn" id="play">▶</button><button class="btn" id="fwd">15 ↷</button><button class="btn" id="next">⏭</button></div><input class="range" id="seek" type="range" min="0" max="100" value="0"><div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="row between" style="margin-top:12px"><label>速度 <select class="select" id="rate"><option>0.75</option><option>0.9</option><option selected>1</option><option>1.1</option><option>1.25</option><option>1.5</option></select></label><label>スリープ <select class="select" id="sleep"><option value="0">なし</option><option value="15">15分</option><option value="30">30分</option><option value="60">60分</option><option value="90">90分</option><option value="120">120分</option></select></label></div><div class="small" id="status" style="margin-top:10px"></div></div><div class="card small"><b>iPhone</b><br>Safariで再生開始 → ホーム画面へ戻る → 画面をロック。ロック画面のメディア操作にも対応します。</div></div><script>
const $=id=>document.getElementById(id),audio=$("audio");let works=JSON.parse(localStorage.getItem("asmrWorksV2")||"null");if(!works)works=[{id:"demo",title:"海姉妹 ～長女・希海＆三女・夏帆～",artist:"CV. 佐藤聡美＆津田美波",desc:"作品情報を登録して使えます。",tracks:[],fav:false}];let currentWork=null,currentIndex=-1,queue=[],sleepTimer=null,currentObjectUrl=null,db;
function save(){localStorage.setItem("asmrWorksV2",JSON.stringify(works))}function fmt(s){if(!isFinite(s))return"0:00";s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open("asmrLibraryDB",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("audio"))r.result.createObjectStore("audio")};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function putBlob(k,b){return new Promise((res,rej)=>{let t=db.transaction("audio","readwrite");t.objectStore("audio").put(b,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function getBlob(k){return new Promise((res,rej)=>{let t=db.transaction("audio","readonly"),r=t.objectStore("audio").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function renderWorks(){let q=$("search").value.toLowerCase();$("works").innerHTML="";works.filter(w=>(w.title+w.artist).toLowerCase().includes(q)).forEach(w=>{let d=document.createElement("div");d.className="work";d.innerHTML=`<div class="cover">🎧</div><div class="workbody"><span class="fav ${w.fav?"on":""}">${w.fav?"★":"☆"}</span><div class="worktitle">${esc(w.title)}</div><div class="meta">${esc(w.artist||"")}</div><span class="tag">${w.tracks.length}トラック</span></div>`;d.onclick=()=>openDetail(w.id);$("works").appendChild(d)})}
function openDetail(id){currentWork=works.find(w=>w.id===id);if(!currentWork)return;$("detail").classList.remove("hidden");$("works").classList.add("hidden");$("search").parentElement.classList.add("hidden");$("detailTitle").textContent=currentWork.title;$("detailArtist").textContent=currentWork.artist||"";$("detailDesc").textContent=currentWork.desc||"";$("favBtn").textContent=currentWork.fav?"★ お気に入り":"☆ お気に入り";$("detailTracks").innerHTML="";if(!currentWork.tracks.length)$("detailTracks").innerHTML='<div class="empty">まだトラックがありません。</div>';currentWork.tracks.forEach((t,i)=>{let d=document.createElement("div");d.className="track";d.innerHTML=`<div class="num">${String(i+1).padStart(2,"0")}</div><div><div class="tn">${esc(t.name)}</div><div class="ts">${t.blobKey?"この端末に保存済み":t.url?"URL音源":"音源未登録"}</div></div>`;d.onclick=()=>playTrack(currentWork,i);$("detailTracks").appendChild(d)})}
$("closeDetail").onclick=()=>{$("detail").classList.add("hidden");$("works").classList.remove("hidden");$("search").parentElement.classList.remove("hidden")};$("favBtn").onclick=()=>{if(currentWork){currentWork.fav=!currentWork.fav;save();openDetail(currentWork.id);renderWorks()}};$('search').oninput=renderWorks;$('addBtn').onclick=()=>$('addPanel').classList.remove('hidden');$('cancelAdd').onclick=()=>$('addPanel').classList.add('hidden');
$("saveWork").onclick=async()=>{let title=$("newTitle").value.trim(),artist=$("newArtist").value.trim(),desc=$("newDesc").value.trim(),name=$("newTrack").value.trim()||"01 本編",url=$("newAudio").value.trim(),file=$("newFile").files[0];if(!title)return alert("作品タイトルを入力してください。");if(url&&file)return alert("音声URLかファイルのどちらか一方を選んでください。");let w={id:crypto.randomUUID(),title,artist,desc,tracks:[],fav:false};if(file){let k="audio-"+crypto.randomUUID();await putBlob(k,file);w.tracks=[{id:crypto.randomUUID(),name,blobKey:k,mime:file.type||"audio/mpeg"}]}else if(url)w.tracks=[{id:crypto.randomUUID(),name,url}];else return alert("音声ファイルか音声URLを指定してください。");works.unshift(w);save();renderWorks();$('addPanel').classList.add('hidden');['newTitle','newArtist','newDesc','newTrack','newAudio','newFile'].forEach(id=>$(id).value='');openDetail(w.id);$('status').textContent=file?'音声をこのiPhoneに保存しました。':'作品を登録しました。'};
async function playTrack(w,i){currentWork=w;queue=w.tracks.filter(t=>t.url||t.blobKey);currentIndex=queue.indexOf(w.tracks[i]);if(currentIndex<0)return;await loadTrack()};async function loadTrack(autoplay=true){let t=queue[currentIndex];if(!t)return;if(currentObjectUrl){URL.revokeObjectURL(currentObjectUrl);currentObjectUrl=null}let src=t.url;if(t.blobKey){let b=await getBlob(t.blobKey);if(!b)return $('status').textContent='保存された音声が見つかりません。';currentObjectUrl=URL.createObjectURL(b);src=currentObjectUrl}audio.src=src;audio.playbackRate=+$('rate').value;$('nowTitle').textContent=t.name;$('nowMeta').textContent=currentWork?.title||'';if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:currentWork?.artist||'ASMR',album:currentWork?.title||'ASMR'});if(autoplay)audio.play().catch(()=>$('status').textContent='画面上の再生ボタンを押してください。')}
$('play').onclick=()=>{if(audio.src)(audio.paused?audio.play():audio.pause())};$('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);$('fwd').onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15);$('prev').onclick=()=>{if(currentIndex>0){currentIndex--;loadTrack()}};$('next').onclick=()=>{if(currentIndex<queue.length-1){currentIndex++;loadTrack()}};audio.onplay=()=>{$('play').textContent='⏸';setSleep()};audio.onpause=()=>$('play').textContent='▶';audio.ontimeupdate=()=>{$('seek').value=audio.duration?audio.currentTime/audio.duration*100:0;$('cur').textContent=fmt(audio.currentTime);$('dur').textContent=fmt(audio.duration)};$('seek').oninput=()=>{if(audio.duration)audio.currentTime=$('seek').value/100*audio.duration};$('rate').onchange=()=>audio.playbackRate=+$('rate').value;function setSleep(){clearTimeout(sleepTimer);let m=+$('sleep').value;if(m){sleepTimer=setTimeout(()=>{audio.pause();$('sleep').value='0';$('status').textContent='スリープタイマーで停止しました。'},m*60000);$('status').textContent=m+'分後に停止します。'}else $('status').textContent=''}$('sleep').onchange=setSleep;audio.onended=()=>{if(currentIndex<queue.length-1){currentIndex++;loadTrack()}else if('mediaSession'in navigator)navigator.mediaSession.playbackState='none'};if('mediaSession'in navigator){let b=(n,f)=>{try{navigator.mediaSession.setActionHandler(n,f)}catch(e){}};b('play',()=>audio.play());b('pause',()=>audio.pause());b('seekbackward',()=>audio.currentTime=Math.max(0,audio.currentTime-15));b('seekforward',()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15));b('previoustrack',()=>$('prev').click());b('nexttrack',()=>$('next').click())}
openDB().then(renderWorks).catch(()=>{renderWorks();$('status').textContent='端末保存を利用できません。'})
</script></body></html>
